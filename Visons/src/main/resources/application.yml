spring:
  application:
    name: visons
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${PORT:9090}

app:
  # Store uploaded profile images inside the project's resources so they are
  # served as static files. Path is relative to the project root.
  upload-dir: src/main/resources/static/uploads/profile-images
  # No pongas la IP publica aqui. Cambia CLIENT_LOGIN_URL desde Docker/EC2.
  client-login-url: ${CLIENT_LOGIN_URL:http://localhost:4200/login}
  cors:
    # No pongas la IP publica fija aqui. Cambia APP_CORS_ALLOWED_ORIGINS desde Docker/EC2.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:9090}
  mail:
    from: ${MAIL_FROM:no-reply@visons.local}

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
